# Notifyi 초기 2축 매핑 (실물 방향 확인 중).
#
# 최신 실물 확인 기준:
# - ID 2: 몸통 앞뒤 기울임. 키보드 텔레옵에서 s가 의도한 방향.
#   스캔값 4097은 0~4095 단회전 위치 경계값으로 보고 1로 정규화한다.
# - ID 3: 머리 앞뒤 기울임. 키보드 텔레옵에서 w가 의도한 방향.
# - 이후 ID 3/4를 교환했으며, 현재 ID 3 위치 1022를 머리축 zero로 지정한다.
#
# ID 2는 zero에서 s 방향으로 최대 30도만 허용한다. 현재 40 ticks가 정상
# 자세로 확인되어 반대 방향은 +4도까지 허용한다. ID 3은 사용자가 정상 자세와 zero 기준
# ±30도 이동 가능 범위를 확인했다. 소프트웨어 한계이며 자동 안전 검증은 아니다.

structure:
  dof: pitch
  active_dof: 2
  units:
    - {index: 1, driven: 2, axis: pitch, role: body}
    - {index: 2, driven: 3, axis: pitch, role: head}

joints:
  body_pitch:
    id: 2
    group: torso
    input_axis: torso_pitch
    direction: -1             # 입력 + 방향이 텔레옵 s 방향
    zero_position: 1          # 스캔 4097을 단회전 범위로 정규화
    min_position: 0
    max_position: 4095
    relative_min_deg: -30
    relative_max_deg: 4        # 정상 실측 40 ticks(+3.4도)를 허용하는 소폭 여유
    wrap_position: true

  head_pitch:
    id: 3
    group: neck
    role: neck
    input_axis: neck_pitch
    direction: 1              # 입력 + 방향이 텔레옵 w 방향
    zero_position: 1022
    min_position: 0
    max_position: 4095
    relative_min_deg: -30      # 사용자 확인 범위, zero는 1022 유지
    relative_max_deg: 30
    wrap_position: true

unsupported_behaviors:
  - direct_user_pose_mirroring_for_yaw_roll
