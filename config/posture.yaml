# 자세 모방 루프 설정.
#
# 카메라로 본 사람의 자세를 최신값으로 판정하고, 나쁜 자세가 지속될 때만
# 미리 정한 고정 포즈를 실행한다.

echo:
  control_hz: 50          # 제어 스레드 주기. 인식 프레임레이트와 무관하다

perception:
  # 기본은 로봇에 연결된 USB 카메라를 사용한다. 장치 번호가 다른 환경에서는
  # --camera 인자로 덮어쓴다.
  camera: /dev/video0
  # 현재 레포에 포함된 lite 모델로 시작한다. full/heavy는 모델 파일을
  # 추가한 뒤 FPS와 오검출을 비교해 선택한다.
  model: lite
  width: 640
  height: 480
  min_visibility: 0.5     # 이 아래면 사람을 못 본 것으로 친다
  # 정면 카메라를 가정한다. 시상면 각은 world landmark 의 z(깊이)로 잡는데,
  # 단일 RGB 카메라에서 z 는 가장 노이즈가 큰 축이다. 흔들리면 카메라를
  # 측면에 두는 편이 훨씬 안정적이다.
  invert_torso: false     # 앞으로 숙일 때 각이 음수면 true
  invert_neck: false

angles:
  max_torso_pitch_deg: 30   # ID 2에서 확인된 s 방향 최대 시험 범위
  max_neck_pitch_deg: 2     # ID 3의 방향만 확인됨; 범위는 임시 제한
  max_torso_yaw_deg: 30
  max_torso_roll_deg: 30
  max_neck_yaw_deg: 30
  max_neck_roll_deg: 30
  median_window: 7          # 7프레임이면 스파이크 방어하면서 지연 최소화
  smoothing_alpha: 0.55     # 상체용. 0.55면 반응 빠르면서 떨림 억제
  neck_smoothing_alpha: 0.35  # 2D 비율은 Z축보다 안정적 → 적당히 반응

# 새 6축 구조에서 카메라 보정 관절·방향을 실물로 확인하지 못해 기본 OFF.
# 현재 관절 목록에는 neck_pitch가 없고 아래 joint는 neck_yaw다.
# 카메라 pitch 안정화로 간주하거나 검증 없이 ON으로 바꾸지 않는다.
# 노트북 웹캠을 사용할 때는 --no-camera-gimbal을 명시할 수 있다.
camera_gimbal:
  enabled: false
  joint: head_pitch

# 몸통 입력을 body_pitch에 보내고, 목 입력은 role: neck 관절에 보낸다.
distribution:
  body_pitch: 1.0

motion:
  profile_velocity: 40
  profile_acceleration: 20
  max_step_deg: 1.5           # 제어 주기당 관절 최대 변화. 50Hz 면 초당 75도
  person_lost_grace_sec: 0.5  # 이만큼 연속으로 안 보여야 복귀 시작
  return_to_neutral_sec: 2.0  # 사람이 사라지면 이 시간에 걸쳐 중립 복귀
  idle_release_sec: 3.0       # 중립 도달 후 토크 해제까지 대기
  # NOTE: 단위 테스트(tests/test_safety.py)는 빠른 실행을 위해
  # return_seconds=2.0, release_seconds=1.0 을 쓴다. 실환경에서는 위 값이
  # 적용된다. 테스트가 config 를 직접 읽지 않는 것은 의도적이다.

# --move 시작 시 zero_position으로 천천히 이동한다. 범위 밖이거나
# 제한시간 안에 도달하지 못하면 자세 반응을 시작하지 않는다.
startup_initialization:
  enabled: true
  timeout_sec: 10.0
  tolerance_ticks: 15
  settle_sec: 0.3

# 교정 판단 정책. BehaviorManager 가 이 값을 읽는다.
correction:
  sustain_seconds: 3.0      # 나쁜 자세가 이만큼 지속돼야 교정 트리거
  max_corrections_per_run: null # 정상 복귀 후 나쁜 자세 에피소드마다 재호출
  cooldown_seconds: 0.0     # 정상 복귀/재감지 정책만으로 재호출을 제어
  escalation_seconds: 60.0  # 같은 문제 반복 시 강도 높이는 기준
  check_interval_sec: 1.0   # 판단 스레드 체크 주기 (초)

# LLM 판단과 하드웨어 사이의 결정론적 정책. 이 값은 모델 출력으로
# 변경되지 않는다.
safety:
  schema: postic.safety.v1
  motion:
    max_step_deg: 1.5
    behavior_max_duration_sec: 1.5
    stop_always: true
  health:
    camera_timeout_sec: 2.0
    control_timeout_sec: 1.0

# 사용자 실험 조건. 정상 자세에서는 로봇이 중립을 유지하고 움직이지 않는다.
experiment:
  condition: posture_trigger
  action_duration_sec: 1.0
  response_timeout_sec: 15.0
  log_dir: data/runs

# 로그 분석 전용 설정. 로봇 제어/자세 판정에는 영향을 주지 않는다.
telemetry:
  recovery_confirm_sec: 1.0  # good 후보가 관측된 시간 기준으로 회복 확정

# posture_trigger에서만 사용하는 고정 개입 포즈.
# 사용자의 관측 각도를 복사하지 않고, 자세 라벨에 따라 이 값만 호출한다.
# 실제 모터 목표는 JointMapper와 SafetyGate가 운용 범위 안에서 제한한다.
intervention:
  # posture_trigger는 action_duration_sec로 끝내지 않고 사용자가 정상
  # 자세로 돌아올 때까지 유지한다. 이 값은 다른 행동 조건의 fallback이다.
  action_duration_sec: 1.5
  max_event_age_sec: 0.75  # 실행 직전 최신 자세와 이벤트 시각을 재확인
  poses:
    # 새 2축 구조에 맞춘 제한된 시험 포즈. 모터 범위는 JointMapper에서도
    # 별도로 제한한다.
    bad_posture:
      torso_pitch_deg: 30.0
      neck_pitch_deg: 2.0
      torso_yaw_deg: 0.0
      torso_roll_deg: 0.0
      neck_yaw_deg: 0.0
      neck_roll_deg: 0.0
