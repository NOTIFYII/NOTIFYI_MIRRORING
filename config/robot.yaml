# Dynamixel 버스 설정. 모든 스크립트가 이 파일을 단일 소스로 읽는다.
bus:
  # OpenCR usb_to_dxl 브리지 사용
  port: /dev/ttyACM0
  baudrate: 57600
  protocol: 2.0

motors:
  model: 2XL430-W250

  # Raspberry Pi/OpenCR 버스에서 확인된 전체 ID.
  ids: [1, 2, 3, 4]

  # 현재 테스트 대상만 활성화한다. ID 1과 4는 움직이지 않는다.
  active_ids: [2, 3]

  # 연결되어 있지만 현재 구동하지 않는 모터.
  unused_ids: [1, 4]
