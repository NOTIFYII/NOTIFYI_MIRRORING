[project]
name = "posture-robot-proto"
version = "0.1.0"
description = "Notifyi 두 모터 자세 반응 프로토타입: 지속된 나쁜 자세에 고정 모션으로 피드백"
requires-python = ">=3.10,<3.13"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
