<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POSTIC Digital Twin — 2XL430 Motor Configurator</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --accent: #58a6ff;
    --accent2: #3fb950;
    --warn: #d29922;
    --err: #f85149;
    --text: #c9d1d9;
    --text2: #8b949e;
    --radius: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    display: grid;
    grid-template-columns: 340px 1fr 320px;
    grid-template-rows: 48px 1fr;
    height: 100vh; overflow: hidden;
  }

  /* ── 헤더 ── */
  header {
    grid-column: 1 / -1;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px;
  }
  header h1 { font-size: 15px; font-weight: 600; color: var(--accent); }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--err); transition: background .3s;
  }
  .status-dot.live { background: var(--accent2); }
  #status-text { font-size: 12px; color: var(--text2); }
  .header-actions { margin-left: auto; display: flex; gap: 8px; }
  button {
    background: var(--panel); border: 1px solid var(--border);
    color: var(--text); padding: 5px 12px; border-radius: var(--radius);
    cursor: pointer; font-size: 12px; transition: border-color .2s;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary {
    background: var(--accent); border-color: var(--accent); color: #0d1117;
    font-weight: 600;
  }
  button.primary:hover { opacity: .85; color: #0d1117; }

  /* ── 왼쪽 패널 — 관절 목록 ── */
  #joint-list {
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .joint-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    cursor: pointer; transition: border-color .2s;
  }
  .joint-card:hover, .joint-card.selected { border-color: var(--accent); }
  .joint-card .jname {
    font-size: 13px; font-weight: 600; color: var(--accent);
    margin-bottom: 4px;
  }
  .joint-card .jmeta {
    font-size: 11px; color: var(--text2);
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .joint-card .jmeta span { display: flex; align-items: center; gap: 3px; }
  .jpos-bar {
    margin-top: 6px; height: 4px; background: var(--border);
    border-radius: 2px; overflow: hidden;
  }
  .jpos-fill { height: 100%; background: var(--accent); width: 50%; transition: width .1s; }
  .jpos-zero { position: absolute; top: 0; width: 2px; height: 4px; background: var(--warn); }

  /* ── 3D 뷰어 ── */
  #viewer {
    position: relative;
    background: #0a0f14;
  }
  #three-canvas { width: 100%; height: 100%; display: block; }
  #overlay-info {
    position: absolute; top: 12px; left: 12px;
    background: rgba(13,17,23,.8); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px 12px;
    font-size: 11px; color: var(--text2); pointer-events: none;
    line-height: 1.6;
  }
  .hover-label {
    position: absolute; display: none;
    background: rgba(13,17,23,.9); border: 1px solid var(--accent);
    border-radius: 4px; padding: 4px 8px;
    font-size: 11px; color: var(--accent); pointer-events: none;
  }

  /* ── 오른쪽 패널 — 설정 ── */
  #config-panel {
    background: var(--panel);
    border-left: 1px solid var(--border);
    overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .section-title {
    font-size: 11px; font-weight: 600; color: var(--text2);
    text-transform: uppercase; letter-spacing: .06em;
    margin-bottom: 6px;
    padding-bottom: 4px; border-bottom: 1px solid var(--border);
  }
  .field-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 6px;
  }
  .field-row label { font-size: 12px; color: var(--text2); flex-shrink: 0; }
  input[type=range] {
    flex: 1; accent-color: var(--accent); height: 4px;
  }
  input[type=number] {
    width: 64px; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 3px 6px; border-radius: 4px; font-size: 12px;
    text-align: right;
  }
  select {
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 4px 8px; border-radius: 4px; font-size: 12px;
    flex: 1;
  }
  .range-row {
    display: grid; grid-template-columns: 1fr auto 1fr;
    gap: 6px; align-items: center; margin-bottom: 8px;
  }
  .range-row .sep { color: var(--text2); font-size: 12px; text-align: center; }
  .range-visual {
    height: 6px; background: var(--border); border-radius: 3px;
    position: relative; margin: 4px 0 10px;
  }
  .range-visual .rng-fill {
    position: absolute; top: 0; height: 100%;
    background: var(--accent); border-radius: 3px; opacity: .5;
  }
  .range-visual .rng-cursor {
    position: absolute; top: -3px; width: 12px; height: 12px;
    background: var(--accent); border-radius: 50%;
    transform: translateX(-50%); transition: left .08s;
  }
  .cur-val {
    font-size: 22px; font-weight: 700; color: var(--accent);
    text-align: center; letter-spacing: -.02em;
    margin: 4px 0;
  }
  .cur-val small { font-size: 13px; color: var(--text2); font-weight: 400; }

  /* AI 명령 */
  #ai-panel { display: flex; flex-direction: column; gap: 8px; }
  textarea {
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); border-radius: var(--radius);
    padding: 8px; font-size: 12px; resize: vertical; min-height: 70px;
    font-family: inherit;
  }
  #ai-log {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px;
    font-size: 11px; color: var(--text2);
    max-height: 120px; overflow-y: auto;
    font-family: monospace;
  }
  .log-entry { margin-bottom: 3px; line-height: 1.4; }
  .log-entry.ok { color: var(--accent2); }
  .log-entry.err { color: var(--err); }
  .log-entry.info { color: var(--text2); }

  /* orientation 뱃지 */
  .orient-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .orient-btn {
    padding: 8px 4px; text-align: center; font-size: 11px;
    border: 1px solid var(--border); border-radius: var(--radius);
    cursor: pointer; transition: all .2s; display: flex;
    flex-direction: column; align-items: center; gap: 3px;
  }
  .orient-btn .icon { font-size: 20px; }
  .orient-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(88,166,255,.1); }
  .orient-btn:hover { border-color: var(--accent2); }

  /* goal position slider */
  #goal-section { display: flex; flex-direction: column; gap: 8px; }
  .goal-controls {
    display: flex; gap: 6px; align-items: center;
  }
  #goal-slider { flex: 1; }
  #goal-val {
    width: 56px; text-align: right; background: var(--bg);
    border: 1px solid var(--border); color: var(--text);
    padding: 3px 6px; border-radius: 4px; font-size: 12px;
  }
</style>
</head>
<body>

<!-- ── 헤더 ── -->
<header>
  <div class="status-dot" id="ws-dot"></div>
  <h1>🤖 POSTIC Digital Twin — 2XL430-W250</h1>
  <span id="status-text">연결 중...</span>
  <div class="header-actions">
    <button onclick="reload()">⟳ 설정 새로고침</button>
    <button onclick="torqueOffAll()">🔴 전체 토크 OFF</button>
    <button class="primary" onclick="applyGoal()">▶ 목표 전송</button>
  </div>
</header>

<!-- ── 왼쪽: 관절 목록 ── -->
<div id="joint-list">
  <div style="font-size:11px;color:var(--text2);margin-bottom:6px;">관절 선택 → 우측에서 범위·방향 설정</div>
</div>

<!-- ── 3D 뷰어 ── -->
<div id="viewer">
  <canvas id="three-canvas"></canvas>
  <div id="overlay-info">
    드래그: 회전 &nbsp;|&nbsp; 스크롤: 줌 &nbsp;|&nbsp; 우클릭: 이동<br>
    관절 클릭 → 선택
  </div>
  <div class="hover-label" id="hover-label"></div>
</div>

<!-- ── 오른쪽: 설정 패널 ── -->
<div id="config-panel">

  <!-- 선택된 관절 현재 값 -->
  <div>
    <div class="section-title">선택된 관절</div>
    <div id="no-selection" style="font-size:12px;color:var(--text2);">왼쪽에서 관절을 선택하세요</div>
    <div id="joint-detail" style="display:none">
      <div style="font-size:14px;font-weight:600;color:var(--accent);margin-bottom:8px" id="detail-name">—</div>
      <div class="cur-val" id="detail-deg">0.0<small>°</small></div>
      <div style="font-size:11px;color:var(--text2);text-align:center;margin-bottom:4px">
        raw: <span id="detail-raw">—</span> &nbsp;|&nbsp; zero: <span id="detail-zero">—</span>
      </div>
      <div class="range-visual">
        <div class="rng-fill" id="range-fill"></div>
        <div class="rng-cursor" id="range-cursor"></div>
      </div>
    </div>
  </div>

  <!-- 구동 범위 설정 -->
  <div id="limits-section">
    <div class="section-title">구동 범위 (°)</div>
    <div class="range-row">
      <input type="number" id="lim-min" value="-45" step="1" min="-180" max="0">
      <span class="sep">~</span>
      <input type="number" id="lim-max" value="45" step="1" min="0" max="180">
    </div>
    <div class="field-row" style="gap:6px">
      <label style="font-size:11px;color:var(--text2);">슬라이더</label>
    </div>
    <div class="field-row">
      <label>Min</label>
      <input type="range" id="lim-min-slider" min="-180" max="0" value="-45"
             oninput="document.getElementById('lim-min').value=this.value">
    </div>
    <div class="field-row">
      <label>Max</label>
      <input type="range" id="lim-max-slider" min="0" max="180" value="45"
             oninput="document.getElementById('lim-max').value=this.value">
    </div>
    <div style="margin-top:4px">
      <button class="primary" style="width:100%" onclick="applyLimits()">✔ 범위 적용 & joints.yaml 저장</button>
    </div>
  </div>

  <!-- 목표 위치 전송 -->
  <div id="goal-section">
    <div class="section-title">목표 위치 전송 (raw tick)</div>
    <div class="goal-controls">
      <input type="range" id="goal-slider" min="0" max="4095" value="2048"
             oninput="document.getElementById('goal-val').value=this.value">
      <input type="number" id="goal-val" value="2048" min="0" max="4095"
             oninput="document.getElementById('goal-slider').value=this.value">
    </div>
    <div style="font-size:11px;color:var(--text2);margin-top:2px">
      ≈ <span id="goal-deg">0.0</span>° from zero
    </div>
    <input type="range" id="goal-slider" style="display:none">
  </div>

  <!-- 모터 장착 방향 -->
  <div>
    <div class="section-title">모터 장착 방향</div>
    <div class="orient-grid" id="orient-grid">
      <div class="orient-btn" data-ori="normal" onclick="selectOrientation('normal')">
        <span class="icon">⬆</span>정방향
      </div>
      <div class="orient-btn" data-ori="inverted" onclick="selectOrientation('inverted')">
        <span class="icon">⬇</span>뒤집힘
      </div>
      <div class="orient-btn" data-ori="sideways_cw" onclick="selectOrientation('sideways_cw')">
        <span class="icon">↻</span>시계방향 누움
      </div>
      <div class="orient-btn" data-ori="sideways_ccw" onclick="selectOrientation('sideways_ccw')">
        <span class="icon">↺</span>반시계 누움
      </div>
    </div>
    <div style="margin-top:8px">
      <button class="primary" style="width:100%" onclick="applyOrientation()">✔ 방향 저장</button>
    </div>
  </div>

  <!-- AI 명령 패널 -->
  <div>
    <div class="section-title">AI 명령 (JSON)</div>
    <div id="ai-panel">
      <textarea id="ai-cmd" placeholder='{"action":"set_goal","motor_id":2,"position":2048}&#10;{"action":"set_limits","joint_name":"waist_lower_yaw","min_deg":-45,"max_deg":45}'></textarea>
      <button onclick="sendAICmd()">▶ 명령 전송</button>
      <div class="section-title" style="margin-top:4px">로그</div>
      <div id="ai-log"></div>
    </div>
  </div>

</div>

<!-- ── Three.js ── -->
<script src="https://cdn.jsdelivr.net/npm/three@0.161/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.161/examples/js/controls/OrbitControls.js"></script>

<script>
// ─── WebSocket ────────────────────────────────────────────────────────────
const WS_URL = 'ws://127.0.0.1:8765'
let ws = null
let jointsData = {}      // name -> spec+state
let selectedJoint = null
let pendingOrientation = null

function connect() {
  ws = new WebSocket(WS_URL)
  ws.onopen = () => {
    document.getElementById('ws-dot').classList.add('live')
    document.getElementById('status-text').textContent = '연결됨 (OpenCR)'
    aiLog('WebSocket 연결됨', 'ok')
  }
  ws.onclose = () => {
    document.getElementById('ws-dot').classList.remove('live')
    document.getElementById('status-text').textContent = '연결 끊김 — 5초 후 재연결...'
    setTimeout(connect, 5000)
  }
  ws.onerror = e => aiLog('WS 오류: ' + e.message, 'err')
  ws.onmessage = e => {
    const msg = JSON.parse(e.data)
    if (msg.type === 'snapshot') {
      jointsData = msg.data
      updateJointList()
      updateThreeScene()
      if (selectedJoint) updateDetailPanel(selectedJoint)
    } else if (msg.type === 'positions') {
      // 빠른 위치 업데이트
      for (const [name, spec] of Object.entries(jointsData)) {
        const raw = msg.data[spec.id]
        if (raw !== undefined) {
          spec.current_position = raw
          const delta = raw - spec.zero_position
          spec.current_deg = delta / (4096 / 360)
        }
      }
      updateThreeScene()
      if (selectedJoint) updateDetailPanel(selectedJoint)
    } else if (msg.type === 'ack') {
      aiLog(`✔ ${msg.action} ${msg.ok ? 'OK' : 'FAIL: ' + msg.msg}`,
            msg.ok ? 'ok' : 'err')
    }
  }
}
connect()

function send(obj) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj))
  else aiLog('WS 연결 없음', 'err')
}

function reload() { send({ action: 'reload' }); aiLog('설정 재로드 요청', 'info') }

function torqueOffAll() {
  aiLog('토크 OFF 는 Python 콘솔에서: python scripts/torque_off.py', 'info')
}

// ─── 관절 목록 ────────────────────────────────────────────────────────────
function updateJointList() {
  const el = document.getElementById('joint-list')
  // 첫 번째 안내 텍스트 외 기존 카드 제거
  const cards = el.querySelectorAll('.joint-card')
  cards.forEach(c => c.remove())

  for (const [name, spec] of Object.entries(jointsData)) {
    const card = document.createElement('div')
    card.className = 'joint-card' + (selectedJoint === name ? ' selected' : '')
    card.dataset.joint = name

    const pct = ((spec.current_position || 2048) / 4095 * 100).toFixed(1)
    const oriLabel = { normal:'정방향', inverted:'뒤집힘',
      sideways_cw:'시계 누움', sideways_ccw:'반시계 누움' }

    card.innerHTML = `
      <div class="jname">ID ${spec.id} — ${name}</div>
      <div class="jmeta">
        <span>📐 ${spec.current_deg != null ? spec.current_deg.toFixed(1) : '?'}°</span>
        <span>🔢 ${spec.current_position ?? '?'}</span>
        <span>📦 ${spec.group}</span>
        <span>🔄 ${oriLabel[spec.orientation] || spec.orientation}</span>
      </div>
      <div class="jpos-bar">
        <div class="jpos-fill" style="width:${pct}%"></div>
      </div>
    `
    card.addEventListener('click', () => selectJoint(name))
    el.appendChild(card)
  }
}

function selectJoint(name) {
  selectedJoint = name
  document.querySelectorAll('.joint-card').forEach(c => {
    c.classList.toggle('selected', c.dataset.joint === name)
  })
  // 하이라이트 3D 오브젝트
  highlightMotor(name)
  // 패널 업데이트
  updateDetailPanel(name)

  const spec = jointsData[name]
  if (spec) {
    document.getElementById('lim-min').value = spec.relative_min_deg ?? -45
    document.getElementById('lim-max').value = spec.relative_max_deg ?? 45
    document.getElementById('lim-min-slider').value = spec.relative_min_deg ?? -45
    document.getElementById('lim-max-slider').value = spec.relative_max_deg ?? 45
    document.getElementById('goal-val').value = spec.current_position ?? 2048
    document.getElementById('goal-slider').value = spec.current_position ?? 2048
    updateGoalDeg()

    // orientation 버튼
    pendingOrientation = spec.orientation || 'normal'
    document.querySelectorAll('.orient-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.ori === pendingOrientation)
    })

    document.getElementById('no-selection').style.display = 'none'
    document.getElementById('joint-detail').style.display = 'block'
  }
}

function updateDetailPanel(name) {
  const spec = jointsData[name]
  if (!spec) return
  document.getElementById('detail-name').textContent =
    `ID ${spec.id} · ${name} · ${spec.group} · ${spec.input_axis}`
  document.getElementById('detail-deg').innerHTML =
    `${(spec.current_deg ?? 0).toFixed(2)}<small>°</small>`
  document.getElementById('detail-raw').textContent = spec.current_position ?? '?'
  document.getElementById('detail-zero').textContent = spec.zero_position

  // 범위 시각화
  const min = spec.relative_min_deg ?? -180
  const max = spec.relative_max_deg ?? 180
  const span = max - min
  const cur = spec.current_deg ?? 0
  const fillLeft = ((0 - min) / span * 100).toFixed(1)
  const fillWidth = (Math.abs(cur) / span * 100).toFixed(1)
  const cursorLeft = ((cur - min) / span * 100).toFixed(1)
  document.getElementById('range-fill').style.left = (min < 0 ? ((-min)/span*100) + '%' : '0')
  document.getElementById('range-fill').style.width = (Math.abs(cur / span) * 100) + '%'
  document.getElementById('range-cursor').style.left = Math.max(0, Math.min(100, parseFloat(cursorLeft))) + '%'
}

function updateGoalDeg() {
  const tick = parseInt(document.getElementById('goal-val').value)
  if (!selectedJoint || !jointsData[selectedJoint]) return
  const zero = jointsData[selectedJoint].zero_position
  const deg = ((tick - zero) / (4096 / 360)).toFixed(2)
  document.getElementById('goal-deg').textContent = deg
}
document.getElementById('goal-val').addEventListener('input', updateGoalDeg)
document.getElementById('goal-slider').addEventListener('input', updateGoalDeg)

function selectOrientation(ori) {
  pendingOrientation = ori
  document.querySelectorAll('.orient-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.ori === ori)
  })
}

function applyLimits() {
  if (!selectedJoint) { aiLog('관절을 먼저 선택하세요', 'err'); return }
  const min = parseFloat(document.getElementById('lim-min').value)
  const max = parseFloat(document.getElementById('lim-max').value)
  if (isNaN(min) || isNaN(max) || min >= max) {
    aiLog('유효하지 않은 범위', 'err'); return
  }
  send({ action: 'set_limits', joint_name: selectedJoint, min_deg: min, max_deg: max })
  aiLog(`범위 설정: ${selectedJoint} [${min}, ${max}]°`, 'info')
}

function applyGoal() {
  if (!selectedJoint) { aiLog('관절을 먼저 선택하세요', 'err'); return }
  const spec = jointsData[selectedJoint]
  const pos = parseInt(document.getElementById('goal-val').value)
  send({ action: 'set_goal', motor_id: spec.id, position: pos })
  aiLog(`목표 전송: ID ${spec.id} → ${pos}`, 'info')
}

function applyOrientation() {
  if (!selectedJoint || !pendingOrientation) return
  const spec = jointsData[selectedJoint]
  send({ action: 'set_orientation', motor_id: spec.id, orientation: pendingOrientation })
  aiLog(`방향 저장: ID ${spec.id} = ${pendingOrientation}`, 'info')
}

function sendAICmd() {
  const raw = document.getElementById('ai-cmd').value.trim()
  const lines = raw.split('\n').filter(l => l.trim())
  for (const line of lines) {
    try {
      const obj = JSON.parse(line)
      send(obj)
      aiLog('→ ' + JSON.stringify(obj), 'info')
    } catch(e) {
      aiLog('JSON 파싱 오류: ' + line, 'err')
    }
  }
}

function aiLog(msg, cls='info') {
  const el = document.getElementById('ai-log')
  const d = document.createElement('div')
  d.className = 'log-entry ' + cls
  d.textContent = new Date().toLocaleTimeString('ko') + ' ' + msg
  el.prepend(d)
  if (el.children.length > 80) el.lastChild.remove()
}

// ─── Three.js 3D 씬 ────────────────────────────────────────────────────────
const canvas = document.getElementById('three-canvas')
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true })
renderer.setPixelRatio(devicePixelRatio)
renderer.shadowMap.enabled = true

const scene = new THREE.Scene()
scene.background = new THREE.Color(0x0a0f14)
scene.fog = new THREE.Fog(0x0a0f14, 20, 60)

const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 100)
camera.position.set(0, 5, 10)

const controls = new THREE.OrbitControls(camera, canvas)
controls.enableDamping = true
controls.dampingFactor = 0.08
controls.target.set(0, 2, 0)

// 조명
scene.add(new THREE.AmbientLight(0x334466, 0.8))
const dir = new THREE.DirectionalLight(0xffffff, 0.9)
dir.position.set(5, 10, 7)
dir.castShadow = true
scene.add(dir)
const pt = new THREE.PointLight(0x58a6ff, 0.4, 15)
pt.position.set(-3, 5, 3)
scene.add(pt)

// 바닥 그리드
const grid = new THREE.GridHelper(20, 20, 0x1f2937, 0x1f2937)
scene.add(grid)

// ── 로봇 구조: 유닛 기반 6축 ──
// joints.yaml structure 참고: waist_lower(yaw+pitch) → waist_upper(yaw+pitch) → neck(roll+yaw)
const MOTOR_DEFS = [
  // [joint_name, parent_name, offset_x, offset_y, offset_z, color]
  { name: 'waist_lower_yaw',   parent: null,              x: 0,    y: 0,   z: 0,    color: 0x58a6ff },
  { name: 'waist_lower_pitch', parent: 'waist_lower_yaw', x: 0,    y: 0,   z: 0.25, color: 0x79c0ff },
  { name: 'waist_upper_yaw',   parent: 'waist_lower_pitch', x: 0, y: 1.2, z: 0,    color: 0x3fb950 },
  { name: 'waist_upper_pitch', parent: 'waist_upper_yaw', x: 0,    y: 0,   z: 0.25, color: 0x56d364 },
  { name: 'neck_roll',         parent: 'waist_upper_pitch', x: 0,  y: 1.2, z: 0,    color: 0xd29922 },
  { name: 'neck_yaw',          parent: 'neck_roll',        x: 0,    y: 0,   z: 0.25, color: 0xe3b341 },
]

const motorMeshes = {}    // name -> { group, body, ring }
const motorPivots = {}    // name -> pivot group (자식들 회전 중심)

// 2XL430 형상: 사각형 바디 + 중앙 샤프트 링
function createMotorMesh(color, orientation='normal', isSelected=false) {
  const group = new THREE.Group()

  // 바디 — 2XL 모양 (납작한 직육면체)
  const bodyGeo = new THREE.BoxGeometry(0.7, 0.35, 0.9)
  const bodyMat = new THREE.MeshStandardMaterial({
    color, roughness: 0.4, metalness: 0.6,
    emissive: isSelected ? color : 0x000000,
    emissiveIntensity: isSelected ? 0.3 : 0,
  })
  const body = new THREE.Mesh(bodyGeo, bodyMat)
  body.castShadow = true
  group.add(body)

  // 샤프트 링 (좌우 양쪽)
  const ringGeo = new THREE.TorusGeometry(0.12, 0.04, 8, 20)
  const ringMat = new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.2, metalness: 0.8 })

  const ringL = new THREE.Mesh(ringGeo, ringMat)
  ringL.position.set(-0.35, 0, 0)
  ringL.rotation.y = Math.PI / 2
  group.add(ringL)

  const ringR = new THREE.Mesh(ringGeo, ringMat)
  ringR.position.set(0.35, 0, 0)
  ringR.rotation.y = Math.PI / 2
  group.add(ringR)

  // 방향 표시 화살표
  const arrowGeo = new THREE.ConeGeometry(0.06, 0.2, 6)
  const arrowMat = new THREE.MeshStandardMaterial({ color: 0xffffff })
  const arrow = new THREE.Mesh(arrowGeo, arrowMat)

  // orientation 에 따른 화살표 방향
  applyOrientationToArrow(arrow, orientation)
  group.add(arrow)

  // 에지 와이어프레임
  const edges = new THREE.EdgesGeometry(bodyGeo)
  const edgeMat = new THREE.LineBasicMaterial({
    color: isSelected ? 0x58a6ff : 0x30363d, linewidth: 1 })
  group.add(new THREE.LineSegments(edges, edgeMat))

  return { group, body, ringL, ringR, arrow }
}

function applyOrientationToArrow(arrow, orientation) {
  switch(orientation) {
    case 'normal':       arrow.position.set(0, 0.28, 0); arrow.rotation.set(0,0,0); break
    case 'inverted':     arrow.position.set(0, -0.28, 0); arrow.rotation.set(Math.PI,0,0); break
    case 'sideways_cw':  arrow.position.set(0.28, 0, 0); arrow.rotation.set(0,0,-Math.PI/2); break
    case 'sideways_ccw': arrow.position.set(-0.28, 0, 0); arrow.rotation.set(0,0,Math.PI/2); break
    default:             arrow.position.set(0, 0.28, 0)
  }
}

// 씬 구성
function buildScene() {
  // 기존 모터 제거
  for (const name of Object.keys(motorMeshes)) {
    const { group } = motorMeshes[name]
    if (group.parent) group.parent.remove(group)
  }

  // 베이스 플레이트
  const baseGeo = new THREE.CylinderGeometry(0.8, 0.9, 0.15, 32)
  const baseMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, metalness: 0.5 })
  const base = new THREE.Mesh(baseGeo, baseMat)
  base.position.y = 0.075
  scene.add(base)

  // 커넥팅 로드 (관절 간 링크)
  const linkMat = new THREE.MeshStandardMaterial({ color: 0x374151, metalness: 0.7 })

  const parentGroups = { null: scene }
  let currentY = 0.15

  for (const def of MOTOR_DEFS) {
    const jData = jointsData[def.name] || {}
    const ori = jData.orientation || 'normal'
    const isSelected = selectedJoint === def.name
    const color = def.color

    const { group, body, ringL, ringR, arrow } = createMotorMesh(color, ori, isSelected)
    group.position.set(def.x, currentY + def.y, def.z)
    group.name = def.name

    const parentGroup = def.parent ? (motorMeshes[def.parent]?.group.parent || scene) : scene
    ;(def.parent ? getMotorTop(def.parent) || scene : scene).add(group)

    motorMeshes[def.name] = { group, body, ringL, ringR, arrow }

    // 링크 막대 (부모 있을 때)
    if (def.parent && def.y > 0) {
      const h = def.y - 0.35
      if (h > 0.05) {
        const linkGeo = new THREE.CylinderGeometry(0.05, 0.05, h, 8)
        const link = new THREE.Mesh(linkGeo, linkMat)
        link.position.y = -(def.y / 2) + 0.175
        group.add(link)
      }
    }

    currentY += def.y
  }
}

function getMotorTop(name) {
  const m = motorMeshes[name]
  return m ? m.group : null
}

// 씬 업데이트 (위치 → 회전)
function updateThreeScene() {
  for (const [name, spec] of Object.entries(jointsData)) {
    const m = motorMeshes[name]
    if (!m) continue
    const deg = spec.current_deg ?? 0
    const rad = deg * Math.PI / 180
    const axis = spec.input_axis || ''

    // 축에 따라 회전 방향 결정
    if (axis.endsWith('_yaw') || axis === 'neck_yaw') {
      m.group.rotation.y = rad * (spec.direction || 1)
    } else if (axis.endsWith('_pitch')) {
      m.group.rotation.x = rad * (spec.direction || 1)
    } else if (axis.endsWith('_roll') || axis === 'neck_roll') {
      m.group.rotation.z = rad * (spec.direction || 1)
    }
  }
}

function highlightMotor(name) {
  for (const [n, m] of Object.entries(motorMeshes)) {
    const selected = n === name
    m.body.material.emissive.setHex(selected ? 0x58a6ff : 0x000000)
    m.body.material.emissiveIntensity = selected ? 0.35 : 0
    m.group.children.forEach(c => {
      if (c.isLineSegments) {
        c.material.color.setHex(selected ? 0x58a6ff : 0x30363d)
      }
    })
  }
}

// Raycaster (클릭 → 관절 선택)
const raycaster = new THREE.Raycaster()
const mouse = new THREE.Vector2()
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect()
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1
  raycaster.setFromCamera(mouse, camera)
  const meshes = Object.entries(motorMeshes).map(([n, m]) => ({ n, mesh: m.body }))
  const hits = raycaster.intersectObjects(meshes.map(m => m.mesh))
  if (hits.length > 0) {
    const hit = hits[0].object
    const found = meshes.find(m => m.mesh === hit)
    if (found) selectJoint(found.n)
  }
})

// 호버 라벨
const hoverLabel = document.getElementById('hover-label')
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect()
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1
  raycaster.setFromCamera(mouse, camera)
  const meshes = Object.entries(motorMeshes).map(([n, m]) => ({ n, mesh: m.body }))
  const hits = raycaster.intersectObjects(meshes.map(m => m.mesh))
  if (hits.length > 0) {
    const found = meshes.find(m => m.mesh === hits[0].object)
    if (found) {
      const spec = jointsData[found.n] || {}
      hoverLabel.textContent = `ID ${spec.id} · ${found.n} · ${(spec.current_deg??0).toFixed(1)}°`
      hoverLabel.style.display = 'block'
      hoverLabel.style.left = (e.clientX - rect.left + 10) + 'px'
      hoverLabel.style.top = (e.clientY - rect.top - 10) + 'px'
      return
    }
  }
  hoverLabel.style.display = 'none'
})

// 리사이즈
function resize() {
  const w = canvas.parentElement.clientWidth
  const h = canvas.parentElement.clientHeight
  renderer.setSize(w, h)
  camera.aspect = w / h
  camera.updateProjectionMatrix()
}
window.addEventListener('resize', resize)
resize()

// 애니메이션 루프
let built = false
function animate() {
  requestAnimationFrame(animate)
  if (!built && Object.keys(jointsData).length > 0) {
    buildScene()
    built = true
  }
  controls.update()
  renderer.render(scene, camera)
}
animate()
</script>
</body>
